name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y libssl-dev && chmod +x build.sh && ./build.sh test
      - name: Loader tests against the real (pinned, SHA-256-checked) firmware
        run: scripts/fetch-firmware.sh && ./build.sh test

  macos-arm64:
    # macos-latest is an Apple Silicon (arm64) runner. Free for public repositories.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          uname -m
          clang --version
          xcrun --show-sdk-version
      - name: Unit tests
        run: chmod +x build.sh && ./build.sh test
      - name: Build macwifictl
        run: ./build.sh cli
      - name: Smoke test (no adapter on the runner)
        run: |
          set +e
          ./build/macwifictl --help;     [ $? -eq 2 ] || exit 1
          ./build/macwifictl identify;   [ $? -eq 3 ] || exit 1   # 3 = no adapter on the runner, the expected answer
          ./build/macwifictl fwload;     [ $? -eq 4 ] || exit 1   # 4 = firmware not downloaded
          ./build/macwifictl up;         [ $? -eq 3 ] || exit 1   # 3 = no adapter
          ./build/macwifictl scan;       [ $? -eq 3 ] || exit 1
          ./build/macwifictl connect;    [ $? -eq 2 ] || exit 1   # 2 = usage (no SSID)
          ./build/macwifictl connect TestNet < /dev/null; [ $? -eq 3 ] || exit 1   # no adapter: never prompts
          ./build/macwifictl join TestNet;  [ $? -eq 2 ] || exit 1   # 2 = needs sudo (checked before anything else)
          ./build/macwifictl list;       [ $? -eq 3 ] || exit 1   # no adapter on the runner
          ./build/macwifictl list --all; echo "list --all exit $?"
          lipo -archs build/macwifictl | grep -q arm64 || exit 1
          codesign --verify --verbose build/macwifictl || exit 1
      - name: Build the menu bar app
        run: ./build.sh app && codesign --verify --verbose build/MacWifi.app
      - name: Build the installer package (firmware downloaded here; the package is not uploaded)
        run: |
          chmod +x scripts/*.sh && scripts/fetch-firmware.sh
          ./build/macwifictl --version
          ./build.sh pkg
          pkgutil --payload-files build/MacWifi.pkg | grep -E "macwifid$|MacWifi.app/Contents/MacOS/MacWifi$|LaunchDaemons|LaunchAgents|uninstall.sh|fetch-firmware.sh|report.sh"
          pkgutil --expand build/MacWifi.pkg build/pkgx && ls build/pkgx/Scripts
          # the release variant: no firmware inside; the installer's download step works from another folder
          MW_PKG_NO_FIRMWARE=1 ./build.sh pkg
          if pkgutil --payload-files build/MacWifi.pkg | grep -q '\.bin$'; then echo "firmware in the release package"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/fwroot" && MW_FW_ROOT="$RUNNER_TEMP/fwroot" scripts/fetch-firmware.sh >/dev/null
          test -f "$RUNNER_TEMP/fwroot/firmware/aic8800D80-legacy-mcu1/fmacfw_8800d80_u02.bin"
          sh scripts/report.sh | head -20
      - uses: actions/upload-artifact@v7
        with:
          name: macwifictl-arm64
          path: build/macwifictl
